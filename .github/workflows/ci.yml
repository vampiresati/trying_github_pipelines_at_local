name: Local CI Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    container:
      image: python:3.12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "Hello from CI"
          echo "Python version:"
          python3 --version

      - name: Run test
        run: |
          echo "Running tests..."
          python3 -c "print('TEST PASSED')"
